<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pegasus Money · ao vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--void:#07070A;--ink:#F4F1EC;--ink2:#A8A29B;--ink3:#6E6A66;--hair:rgba(255,255,255,.075);
--M:#BF8608;--V:#528DFF;--E:#02AD6D;--Ml:#F0B93E;--Vl:#8FB6FF;--El:#3FD79B;
--gold:#E9B949;--pos:#2FD48A;--neg:#FF4D5E;--f:"Instrument Sans",system-ui;--d:"JetBrains Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f);font-size:15px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(70vw 46vh at 50% -4%,rgba(233,185,73,.26),transparent 64%),
 radial-gradient(56vw 44vh at 102% 40%,rgba(255,61,139,.17),transparent 66%),
 radial-gradient(60vw 48vh at -8% 74%,rgba(82,141,255,.16),transparent 66%)}
.wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:18px 14px 80px}
h1{font-family:Archivo;font-weight:800;letter-spacing:-.05em;font-size:20px;margin:0;
 background:linear-gradient(96deg,#F7DFA0,var(--gold) 42%,#B98520);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 i{font-style:normal;-webkit-text-fill-color:var(--ink)}
h2{font-family:Archivo;font-weight:800;letter-spacing:-.03em;font-size:17px;margin:26px 0 10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:9px;background:var(--neg);box-shadow:0 0 9px currentColor}
.dot.on{background:var(--pos)}
.st{font-family:var(--d);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
 display:flex;align-items:center;gap:7px;margin-left:auto}
.panel{border-radius:15px;padding:15px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
 backdrop-filter:blur(20px);border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border-radius:13px;padding:13px 14px;background:rgba(255,255,255,.035);border:1px solid var(--hair)}
.tile dt{font-family:var(--d);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.tile dd{margin:6px 0 0;font-family:var(--d);font-size:26px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--ink3);margin-top:5px}
.rib{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.rib::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;width:26px;height:34px;border-radius:7px;display:grid;place-items:center;color:#07070A;
 font-family:var(--d);font-size:10px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.rc.M{background:linear-gradient(165deg,var(--Ml),var(--M))}.rc.V{background:linear-gradient(165deg,var(--Vl),var(--V))}
.rc.E{background:linear-gradient(165deg,var(--El),var(--E))}
table{width:100%;border-collapse:collapse;font-family:var(--d);font-size:12px;font-variant-numeric:tabular-nums}
th{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:right;padding:8px;border-bottom:1px solid var(--hair)}
td{padding:9px 8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);color:var(--ink2)}
th:first-child,td:first-child{text-align:left;min-width:86px}
@media(max-width:520px){th,td{padding:8px 5px;font-size:11px}}td.hl{color:var(--ink);font-weight:700}
.tag{padding:2px 8px;border-radius:99px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--hair);color:var(--ink3)}
.tag.ok{color:var(--pos);border-color:rgba(47,212,138,.4);background:rgba(47,212,138,.1)}
.tag.no{color:var(--neg);border-color:rgba(255,77,94,.4);background:rgba(255,77,94,.1)}
.tag.mid{color:var(--gold);border-color:rgba(233,185,73,.4);background:rgba(233,185,73,.1)}
.feed{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.sg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--hair)}
.sg b{font-family:Archivo;font-weight:800;letter-spacing:-.02em}
.sg .w{margin-left:auto;font-family:var(--d);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--ink3);font-size:12.5px;line-height:1.6}
.overflow{overflow-x:auto}
</style></head><body>
<div id="bg"></div>
<div class="wrap">
  <div class="top">
    <h1>PEGASUS<i>MONEY</i></h1>
    <span class="st"><i class="dot" id="dot"></i><span id="conn">conectando</span></span>
  </div>

  <h2>Estado da mesa</h2>
  <div class="tiles" id="tiles"></div>
  <div class="panel" style="margin-top:11px"><div class="rib" id="rib"></div></div>

  <h2>Placar das regras</h2>
  <div class="panel overflow"><table id="board"></table>
    <p class="muted" style="margin:12px 0 0">Uma regra só é <b style="color:var(--pos)">confirmada</b> quando o piso do
    intervalo de confiança passa de 50%. Fica <b style="color:var(--neg)">cortada</b> — e o motor a desliga sozinho —
    quando o teto não alcança 50%, ou seja, quando perder deixou de ser azar.</p></div>

  <h2>Sinais</h2>
  <div class="panel"><div class="feed" id="feed"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const NAME={M:"MANDANTE",E:"EMPATE",V:"VISITANTE"};
const pct=v=>v==null?"—":(v*100).toFixed(1).replace(".",",")+"%";
function render(s){
  const c=s.context||{}, st=c.streak||{};
  $("tiles").innerHTML=`
    <div class="tile"><dt>Rodadas</dt><dd>${s.total??0}</dd><div class="s">no banco</div></div>
    <div class="tile"><dt>Sequência</dt><dd style="color:var(--${st.side||"M"}l,var(--ink))">${st.len||0}×</dd>
      <div class="s">${st.side?NAME[st.side]:"—"}</div></div>
    <div class="tile"><dt>Runs p</dt><dd>${c.runsP??"—"}</dd><div class="s">${c.runsP!=null&&c.runsP<0.05?"desvio":"sem desvio"}</div></div>
    <div class="tile"><dt>Markov p</dt><dd>${c.markovP??"—"}</dd><div class="s">${c.markovP!=null&&c.markovP<0.05?"desvio":"sem desvio"}</div></div>`;
  $("rib").innerHTML=(s.rounds||[]).slice(-46).map(r=>`<i class="rc ${r.side}">${r.diff!=null?"+"+r.diff:r.side}</i>`).join("");
  $("rib").scrollLeft=$("rib").scrollWidth;
  $("board").innerHTML=`<thead><tr><th>Regra</th><th>Entradas</th><th>Acerto</th><th>IC95</th><th>Unid.</th><th>Veredito</th></tr></thead><tbody>`+
   (s.scoreboard||[]).map(r=>{
     const cls=r.verdict==="confirmada"?"ok":r.verdict==="cortada"?"no":r.verdict==="em prova"?"mid":"";
     return `<tr><td class="hl">${r.label}${r.enabled?"":" ·off"}</td><td>${r.decided}</td>
       <td class="hl" style="color:${r.hit>0.5?"var(--pos)":"var(--ink)"}">${pct(r.hit)}</td>
       <td>${r.decided?pct(r.ci[0])+"–"+pct(r.ci[1]):"—"}</td>
       <td style="color:${r.pnl>=0?"var(--pos)":"var(--neg)"}">${r.pnl>0?"+":""}${r.pnl.toFixed(1)}</td>
       <td><span class="tag ${cls}">${r.verdict}${r.needed?" ·"+r.needed:""}</span></td></tr>`;}).join("")+`</tbody>`;
  $("feed").innerHTML=(s.signals||[]).map(g=>{
    const cls=g.status==="win"?"ok":g.status==="loss"?"no":"";
    return `<div class="sg"><span class="rc ${g.pick}" style="width:22px;height:22px;font-size:9px">${g.pick}</span>
      <div><b>${NAME[g.pick]}</b><div class="s muted" style="font-size:11px">${g.rule} · gatilho ${g.trigger_len}× ${NAME[g.trigger_side]||""}</div></div>
      <span class="w"><span class="tag ${cls}">${g.status}</span></span></div>`;}).join("")
    || `<p class="muted">Nenhum sinal ainda. O motor emite quando uma regra ativa encontra o gatilho.</p>`;
}
function connect(){
  const es=new EventSource("/events");
  es.onopen=()=>{$("dot").classList.add("on");$("conn").textContent="ao vivo"};
  es.onerror=()=>{$("dot").classList.remove("on");$("conn").textContent="reconectando"};
  es.onmessage=e=>{const ev=JSON.parse(e.data);
    if(ev.type==="hello") render(ev.state);
    else fetch("/api/state").then(r=>r.json()).then(render);};
}
fetch("/api/state").then(r=>r.json()).then(render).catch(()=>{});
connect();
</script></body></html>
